<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Invitation Declined — PodScheduler</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background:#0a0a16; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
    .invite-card { background:#141428; border:1px solid rgba(255,255,255,.08); border-radius:24px; padding:36px 24px; max-width:400px; width:100%; text-align:center; }
    .icon-ring { width:80px;height:80px;border-radius:28px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;margin:0 auto 20px; }
  </style>
</head>
<body>
  <div class="invite-card">
    <div class="icon-ring">
      <span style="font-size:2.4rem;">😔</span>
    </div>
    <h2 style="font-size:1.4rem;font-weight:800;color:rgba(255,255,255,.7);margin-bottom:8px;">Maybe next time</h2>
    <p style="color:rgba(255,255,255,.55);font-size:.95rem;margin-bottom:20px;">
      Hi <strong style="color:#fff;">{{ pg.participant.name }}</strong>,
      you've declined the invitation to appear on
      <strong style="color:#fff;">{{ pg.podcast.title }}</strong>.
    </p>
    <p style="color:rgba(255,255,255,.35);font-size:.82rem;margin:0;">Thanks for letting us know. We hope to have you on a future episode!</p>
  </div>
</body>
</html>
