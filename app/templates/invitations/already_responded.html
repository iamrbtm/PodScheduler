<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Already Responded</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background:#0f0f1a; min-height:100vh;" class="d-flex align-items-center justify-content-center">
  <div class="text-center p-5" style="max-width:480px;">
    <div style="font-size:4rem;">ℹ️</div>
    <h2 class="mt-3 fw-bold">Already responded</h2>
    <p class="text-white-50 mt-2">
      Hi <strong class="text-white">{{ pg.participant.name }}</strong>,
      you already <strong>{{ already }}</strong> this invitation for
      <strong class="text-white">{{ pg.podcast.title }}</strong>.
    </p>
    <p class="text-white-50 small">If you'd like to change your response, please contact the host directly.</p>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
