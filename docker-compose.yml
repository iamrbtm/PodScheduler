services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://podscheduler:podscheduler@db:5432/podscheduler
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: podscheduler
      POSTGRES_USER: podscheduler
      POSTGRES_PASSWORD: podscheduler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podscheduler -d podscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage for episode audio files.
  # Directories (Apple, Spotify, etc.) fetch enclosure URLs directly from
  # here via the `caddy` reverse proxy, so this must end up reachable at
  # your public domain — see PUBLIC_BASE_URL in .env.
  #
  # Uses Bitnami's image, not MinIO Inc.'s own minio/minio (Docker Hub) or
  # quay.io/minio/minio — both stopped serving free anonymous pulls in
  # 2024/2025 (every tag we tried 401'd or 404'd). Bitnami also froze their
  # own free `bitnami/*` images around the same time and moved the last
  # public copies to the `bitnamilegacy/*` namespace, which is what this
  # points at. See CLAUDE.md's "known sharp edges" for the full story.
  #
  # MINIO_DEFAULT_BUCKETS creates the bucket and makes it publicly
  # readable on first boot, so no separate mc/minio-init container is
  # needed at all (mc is exactly the kind of extra image that kept
  # failing to pull above).
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-podscheduler}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123456}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-podscheduler-media}:public
    volumes:
      - minio_data:/bitnami/minio/data
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS for the public domain. Routes
  # /media/* to MinIO (audio files) and everything else to the Flask app
  # (including /feed/<slug>.xml). Requires PUBLIC_DOMAIN in .env and DNS
  # already pointed at this host — see README/CLAUDE.md distribution notes.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      MINIO_BUCKET: ${MINIO_BUCKET:-podscheduler-media}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
